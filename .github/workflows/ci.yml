name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node · lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs before anything else: the token build is also the token test.
      # It fails the pipeline on an unresolved reference, on a semantic token
      # missing from one theme, and on any token holding pure white (ADR-0015).
      - name: tokens
        run: pnpm tokens

      - run: pnpm lint
      - run: pnpm typecheck

      # Default engine: PGlite — PostgreSQL in WASM, no service container, so
      # these run in seconds and need no registry pull.
      - run: pnpm test

  # The same suite against a real server. PGlite is a different major version
  # from the one production pins, so a suite that only ever saw one engine
  # could not tell us the SQL is portable. This job is what makes PGlite
  # trustworthy for the fast path above.
  identity-real-postgres:
    name: identity · against real postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: earshot
          POSTGRES_PASSWORD: earshot_dev_only
          POSTGRES_DB: earshot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U earshot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migrate
        run: pnpm --filter @earshot/identity migrate
        env:
          DATABASE_URL: postgres://earshot:earshot_dev_only@localhost:5432/earshot
      - name: test
        run: pnpm --filter @earshot/identity test
        env:
          DATABASE_URL: postgres://earshot:earshot_dev_only@localhost:5432/earshot

  # Guards the thing that will actually drift: the design tokens are the source
  # of truth, so a hand-edit of the generated CSS must not survive review.
  generated-is-current:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens
      - name: fail if the build changed a committed file
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated output differs from what is committed."
            echo "Run 'pnpm tokens' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  compose:
    name: docker compose is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose file is valid"
